[package]
name = "fq-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "feiqiu-r 身份与安全通道:Ed25519 身份、密钥绑定签名、Noise IK 握手、TOFU 指纹信任"

[dependencies]
fq-proto = { path = "../fq-proto" }
# 身份签名:Ed25519
ed25519-dalek = "3"
# 熵源:直接用 getrandom,避免 rand_core 各主版本间的 feature/API 漂移
getrandom = "0.3"
# Noise 协议框架(IK 模式,Curve25519 + ChaChaPoly + BLAKE2s)
snow = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true
