[package]
name = "fq-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "feiqiu-r 应用核心:身份装配、事件泵、历史落库、送达/已读回执、离线补发"

[dependencies]
fq-proto = { path = "../fq-proto" }
fq-crypto = { path = "../fq-crypto" }
fq-net = { path = "../fq-net" }
fq-store = { path = "../fq-store" }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
