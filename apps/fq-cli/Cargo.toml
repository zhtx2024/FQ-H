[package]
name = "fq-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "feiqiu-r 命令行客户端:P6 MVP 验收入口(交互 REPL + 脚本驱动)"

[[bin]]
name = "fq-cli"
path = "src/main.rs"

[dependencies]
fq-core = { path = "../../crates/fq-core" }
fq-net = { path = "../../crates/fq-net" }
fq-proto = { path = "../../crates/fq-proto" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
